{% extends "base.html" %}
{% block title %}Invoices{% endblock %}
{% block body %}
<h1>Invoices</h1>
<form method="get" action="/invoices">
  <label>Filter <input type="text" name="q" value="{{ q }}"></label>
  <button type="submit">Apply filter</button>
</form>
<table>
  <tr><th>Number</th><th>Vendor</th><th>Date</th><th>Amount</th></tr>
  {% for row in rows %}
  <tr>
    <td><a href="/invoices/{{ row.id }}">{{ row.number }}</a></td>
    <td>{{ row.vendor }}</td>
    <td>{{ row.date }}</td>
    <td>{{ format_inr(row.amount) }}</td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
